command:
  - "python"
  - "coastal_mcp_server.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: MARINE_EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: NWS_USER_AGENT
    value: "(dataexpert-capstone-coastal-ops-mcp, student@example.com)"
  - name: MIN_MARINE_SIMILARITY
    value: "0.40"
